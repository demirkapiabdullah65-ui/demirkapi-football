<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Demirkapı Football</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06130b;color:#fff;font-family:Arial,sans-serif;touch-action:none}
button{font-weight:900;color:white;border:0;cursor:pointer}

#menu,#teams,#game,#finish{position:fixed;inset:0}
#menu{
display:flex;align-items:center;justify-content:center;
background:radial-gradient(circle at 50% 15%,#168447,#061a0e 55%,#020604)
}
.menu{
width:min(92%,520px);padding:35px 25px;text-align:center;
border-radius:30px;background:#03130ddd;
border:1px solid #ffffff20;box-shadow:0 25px 80px #000b
}
.ball{font-size:70px}
.title{font-size:43px;font-weight:1000;letter-spacing:3px;margin:0}
.subtitle{color:#a9cbb7;margin:8px 0 30px}
.btn{
width:100%;padding:17px;margin:7px 0;border-radius:15px;font-size:18px;
background:linear-gradient(135deg,#1dc765,#08783b)
}
.btn.gray{background:#ffffff12;border:1px solid #ffffff20}

#teams{
display:none;background:#04150ddd
}
.header{
height:70px;display:flex;align-items:center;justify-content:space-between;
padding:0 18px;background:#020805dd;border-bottom:1px solid #ffffff20
}
.back{background:#ffffff12;padding:10px 15px;border-radius:10px}
.preview{
display:flex;align-items:center;justify-content:center;gap:35px;
padding:15px;background:#0006
}
.previewTeam{text-align:center;font-weight:900}
.previewLogo{font-size:40px}
.vs{font-size:25px;color:#6bea9d}
.teamArea{height:calc(100% - 130px);overflow:auto;padding:18px}
.info{text-align:center;color:#a9cbb7;font-size:13px;margin-bottom:15px}
.teamGrid{
width:min(100%,900px);margin:auto;
display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px
}
.team{
padding:17px 8px;text-align:center;border-radius:18px;
background:#ffffff0d;border:1px solid #ffffff18
}
.team.selected1{border:2px solid #258bff;background:#258bff22}
.team.selected2{border:2px solid #ff3449;background:#ff344922}
.teamLogo{font-size:42px}.power{font-size:12px;color:#9fc5ad;margin-top:5px}

#game{display:none;background:#08773b}
canvas{position:absolute;inset:0;width:100%;height:100%}

.hud{
position:fixed;top:8px;left:50%;transform:translateX(-50%);
z-index:20;display:flex;align-items:center;gap:18px;
padding:8px 17px;border-radius:16px;background:#020805e8;
border:1px solid #ffffff20;white-space:nowrap
}
.score{font-size:23px;font-weight:900;text-align:center}
.time{font-size:13px;color:#9de9b7}

.controls{
position:fixed;left:0;right:0;bottom:12px;z-index:30;
display:flex;justify-content:space-between;align-items:end;padding:0 15px
}
.joy{
width:145px;height:145px;border-radius:50%;
background:#ffffff12;border:2px solid #ffffff30;position:relative
}
.knob{
position:absolute;width:62px;height:62px;left:39px;top:39px;
border-radius:50%;background:#ffffff45;border:2px solid #ffffff80
}
.actions{display:grid;grid-template-columns:repeat(2,75px);gap:8px}
.action{
width:75px;height:57px;border-radius:16px;
background:#06120ddd;border:1px solid #ffffff30;font-size:12px
}
.pass{background:#138b4bdd}.shoot{background:#d52239dd}.run{background:#176fc9dd}

#finish{
display:none;align-items:center;justify-content:center;text-align:center;
background:#020805ee;z-index:50
}
.finish{
width:min(92%,430px);padding:30px;border-radius:25px;
background:#071b10;border:1px solid #ffffff20
}
.final{font-size:52px;font-weight:900;margin:15px}

@media(max-width:600px){
.title{font-size:35px}
.joy{width:125px;height:125px}
.knob{left:31px;top:31px}
.actions{grid-template-columns:repeat(2,65px)}
.action{width:65px;height:53px;font-size:10px}
}
</style>
</head>

<body>

<section id="menu">
<div class="menu">
<div class="ball">⚽</div>
<div class="title">DEMİRKAPI</div>
<div class="title">FOOTBALL</div>
<div class="subtitle">11'e 11 futbol</div>
<button class="btn" onclick="openTeams()">⚽ HIZLI MAÇ</button>
<button class="btn gray" onclick="alert('Yakında!')">🏆 KARİYER</button>
<button class="btn gray" onclick="alert('Yakında!')">🏆 LİG & KUPA</button>
<button class="btn gray" onclick="alert('Yakında!')">⚙️ AYARLAR</button>
</div>
</section>

<section id="teams">
<div class="header">
<button class="back" onclick="location.reload()">← Geri</button>
<strong>TAKIM SEÇ</strong>
<div></div>
</div>

<div class="preview">
<div class="previewTeam">
<div id="logo1" class="previewLogo">🔵</div>
<div id="name1">OYUNCU 1</div>
</div>
<div class="vs">VS</div>
<div class="previewTeam">
<div id="logo2" class="previewLogo">🔴</div>
<div id="name2">OYUNCU 2</div>
</div>
</div>

<div class="teamArea">
<div class="info">
Önce Oyuncu 1, sonra Oyuncu 2 takımını seç.<br>
İkinci takım seçildiğinde maç otomatik başlar.
</div>
<div id="teamGrid" class="teamGrid"></div>
</div>
</section>

<section id="game">

<canvas id="canvas"></canvas>

<div class="hud">
<div>
<div id="teamA">OYUNCU 1</div>
<div id="score" class="score">0 - 0</div>
<div id="teamB">OYUNCU 2</div>
</div>
<div id="time" class="time">01:30</div>
</div>

<div class="controls">

<div id="joy" class="joy">
<div id="knob" class="knob"></div>
</div>

<div class="actions">
<button id="pass" class="action pass">🎯 PAS</button>
<button id="shoot" class="action shoot">💥 ŞUT</button>
<button id="run" class="action run">💨 HIZLI</button>
<button id="switch" class="action">🔄 OYUNCU</button>
</div>

</div>
</section>

<section id="finish">
<div class="finish">
<div style="font-size:60px">🏆</div>
<h1>MAÇ BİTTİ</h1>
<div id="winner"></div>
<div id="finalScore" class="final">0 - 0</div>
<button class="btn" onclick="restart()">🔄 TEKRAR OYNA</button>
<button class="btn gray" onclick="location.reload()">🏠 ANA MENÜ</button>
</div>
</section>

<script>

const teamData=[
["Beşiktaş","⚫",84],
["Galatasaray","🟡",86],
["Fenerbahçe","🔵",85],
["Trabzonspor","🔴",78],
["Barcelona","🔵🔴",90],
["Real Madrid","👑",93],
["Manchester City","🔷",94],
["Liverpool","🔴",89],
["Bayern Münih","🔴⚪",92],
["PSG","🔵🔴",88],
["Demirkapı FK","🟢",82]
];

const names=[
"KALECİ","YILMAZ","KAYA","DEMİR","ÇELİK",
"ŞAHİN","AKSOY","KARACA","ARSLAN",
"DOĞAN","TÜRK"
];

let team1=null,team2=null,selecting=1;

const menu=document.getElementById("menu");
const teams=document.getElementById("teams");
const game=document.getElementById("game");
const finish=document.getElementById("finish");

function openTeams(){
menu.style.display="none";
teams.style.display="block";
}

const grid=document.getElementById("teamGrid");

teamData.forEach(t=>{
const d=document.createElement("div");
d.className="team";
d.innerHTML=`
<div class="teamLogo">${t[1]}</div>
<strong>${t[0]}</strong>
<div class="power">GÜÇ ${t[2]}</div>`;
d.onclick=()=>chooseTeam(t,d);
grid.appendChild(d);
});

function chooseTeam(t,d){

if(selecting===1){
team1=t;
document.querySelectorAll(".team").forEach(x=>x.classList.remove("selected1"));
d.classList.add("selected1");
logo1.textContent=t[1];
name1.textContent=t[0];
selecting=2;
}else{
team2=t;
document.querySelectorAll(".team").forEach(x=>x.classList.remove("selected2"));
d.classList.add("selected2");
logo2.textContent=t[1];
name2.textContent=t[0];
setTimeout(startGame,300);
}
}


/* OYUN */

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let W,H;
let players=[];
let ball;
let selected=0;
let score1=0,score2=0;
let matchTime=90;
let running=false;
let sprint=false;
let joyX=0,joyY=0;

const keys={};

function resize(){

W=innerWidth;
H=innerHeight;

canvas.width=W*devicePixelRatio;
canvas.height=H*devicePixelRatio;

ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);

}

addEventListener("resize",resize);


/* 11 OYUNCU */

const formation=[
[.06,.50],
[.17,.18],[.17,.39],[.17,.61],[.17,.82],
[.35,.20],[.35,.40],[.35,.60],[.35,.80],
[.55,.38],[.55,.62]
];

function createTeam(side,color){

return formation.map((f,i)=>{

let x=side===1?W*f[0]:W*(1-f[0]);
let y=80+(H-170)*f[1];

return{
x,y,homeX:x,homeY:y,
vx:0,vy:0,
team:side,
color,
number:i+1,
name:names[i],
r:i===0?18:16,
speed:i===0?125:155
};

});

}

function reset(){

players=[
...createTeam(1,"#167cff"),
...createTeam(2,"#ef3044")
];

ball={
x:W/2,
y:H/2,
vx:0,
vy:0,
owner:null
};

selected=0;

}

function startGame(){

teams.style.display="none";
game.style.display="block";

teamA.textContent=team1[0];
teamB.textContent=team2[0];

score1=0;
score2=0;
matchTime=90;

resize();
reset();
updateScore();

running=true;
last=performance.now();

requestAnimationFrame(loop);

}

function restart(){

finish.style.display="none";
game.style.display="block";

score1=score2=0;
matchTime=90;

resize();
reset();
updateScore();

running=true;
last=performance.now();

requestAnimationFrame(loop);

}


/* KLAVYE */

addEventListener("keydown",e=>{
keys[e.key.toLowerCase()]=true;
});

addEventListener("keyup",e=>{
keys[e.key.toLowerCase()]=false;
});


/* OYUNCU */

function moveUser(p,dt){

let x=joyX;
let y=joyY;

if(keys.w)y-=1;
if(keys.s)y+=1;
if(keys.a)x-=1;
if(keys.d)x+=1;

let d=Math.hypot(x,y);

if(d>1){
x/=d;
y/=d;
}

let speed=sprint?300:170;

p.vx=x*speed;
p.vy=y*speed;

p.x+=p.vx*dt;
p.y+=p.vy*dt;

p.x=Math.max(25,Math.min(W-25,p.x));
p.y=Math.max(75,Math.min(H-90,p.y));

if(distance(p,ball)<p.r+ball.r+8){
ball.owner=p;
}

}


/* YAPAY ZEKA */

function moveAI(p,dt){

if(p===players[selected])return;

let dx=p.homeX-p.x;
let dy=p.homeY-p.y;

let nearest=nearestPlayer(p.team);

if(nearest===p){

dx=ball.x-p.x;
dy=ball.y-p.y;

}else if(distance(p,ball)<230){

dx=ball.x-p.x;
dy=ball.y-p.y;

}

let d=Math.hypot(dx,dy);

if(d>5){

p.vx=dx/d*p.speed;
p.vy=dy/d*p.speed;

p.x+=p.vx*dt;
p.y+=p.vy*dt;

}

if(distance(p,ball)<p.r+ball.r+7){
ball.owner=p;
}

}

function nearestPlayer(team){

let best=null;
let bestD=Infinity;

players.forEach(p=>{
if(p.team!==team)return;

let d=distance(p,ball);

if(d<bestD){
bestD=d;
best=p;
}
});

return best;
}

function distance(a,b){
return Math.hypot(a.x-b.x,a.y-b.y);
}


/* PAS */

function passBall(){

let p=players[selected];

if(ball.owner!==p)return;

let mates=players.filter(x=>x.team===p.team&&x!==p);

let target=mates.reduce((a,b)=>
distance(a,ball)<distance(b,ball)?a:b
);

let dx=target.x-p.x;
let dy=target.y-p.y;
let d=Math.hypot(dx,dy)||1;

ball.owner=null;
ball.vx=dx/d*430;
ball.vy=dy/d*430;

}


/* ŞUT */

function shootBall(){

let p=players[selected];

if(ball.owner!==p)return;

let gx=p.team===1?W:0;

let dx=gx-ball.x;
let dy=H/2-ball.y;
let d=Math.hypot(dx,dy)||1;

ball.owner=null;
ball.vx=dx/d*720;
ball.vy=dy/d*720;

}


/* BUTONLAR */

document.getElementById("pass").addEventListener("pointerdown",passBall);
document.getElementById("shoot").addEventListener("pointerdown",shootBall);

document.getElementById("run").addEventListener("pointerdown",()=>{
sprint=true;
});

document.getElementById("run").addEventListener("pointerup",()=>{
sprint=false;
});

document.getElementById("run").addEventListener("pointercancel",()=>{
sprint=false;
});

document.getElementById("switch").addEventListener("pointerdown",()=>{

let p=nearestPlayer(1);

if(p)selected=players.indexOf(p);

});


/* JOYSTICK */

const joy=document.getElementById("joy");
const knob=document.getElementById("knob");

let joyActive=false;

function joyMove(e){

if(!joyActive)return;

let r=joy.getBoundingClientRect();

let dx=e.clientX-(r.left+r.width/2);
let dy=e.clientY-(r.top+r.height/2);

let max=43;
let d=Math.hypot(dx,dy);

if(d>max){
dx=dx/d*max;
dy=dy/d*max;
}

knob.style.transform=`translate(${dx}px,${dy}px)`;

joyX=dx/max;
joyY=dy/max;

}

joy.addEventListener("pointerdown",e=>{
joyActive=true;
joy.setPointerCapture(e.pointerId);
joyMove(e);
});

joy.addEventListener("pointermove",joyMove);

joy.addEventListener("pointerup",()=>{
joyActive=false;
joyX=0;
joyY=0;
knob.style.transform="translate(0,0)";
});


/* GÜNCELLE */

function update(dt){

matchTime-=dt;

let sec=Math.max(0,Math.ceil(matchTime));

document.getElementById("time").textContent=
"00:"+String(sec).padStart(2,"0");

moveUser(players[selected],dt);

players.forEach(p=>moveAI(p,dt));

if(ball.owner){

ball.x=ball.owner.x+(ball.owner.team===1?20:-20);
ball.y=ball.owner.y;

}else{

ball.x+=ball.vx*dt;
ball.y+=ball.vy*dt;

ball.vx*=.993;
ball.vy*=.993;

}

let top=55;
let bottom=H-75;

if(ball.y<top){
ball.y=top;
ball.vy=Math.abs(ball.vy);
}

if(ball.y>bottom){
ball.y=bottom;
ball.vy=-Math.abs(ball.vy);
}

let gt=H/2-90;
let gb=H/2+90;

if(ball.x<0){

if(ball.y>gt&&ball.y<gb){

score2++;
goal();

}else{

ball.x=10;
ball.vx=Math.abs(ball.vx);

}

}

if(ball.x>W){

if(ball.y>gt&&ball.y<gb){

score1++;
goal();

}else{

ball.x=W-10;
ball.vx=-Math.abs(ball.vx);

}

}

if(matchTime<=0)endGame();

}

function goal(){

updateScore();
reset();

}

function updateScore(){
document.getElementById("score").textContent=score1+" - "+score2;
}


/* ÇİZ */

function draw(){

ctx.clearRect(0,0,W,H);

ctx.fillStyle="#087b3c";
ctx.fillRect(0,0,W,H);

for(let y=0;y<H;y+=70){
ctx.fillStyle=(y/70)%2?"#08763a":"#0a8141";
ctx.fillRect(0,y,W,70);
}

ctx.strokeStyle="#fff";
ctx.lineWidth=3;

ctx.strokeRect(5,55,W-10,H-130);

ctx.beginPath();
ctx.moveTo(W/2,55);
ctx.lineTo(W/2,H-75);
ctx.stroke();

ctx.beginPath();
ctx.arc(W/2,(H-20)/2,90,0,Math.PI*2);
ctx.stroke();

ctx.strokeRect(5,H/2-145,135,290);
ctx.strokeRect(W-140,H/2-145,135,290);

ctx.strokeRect(0,H/2-90,25,180);
ctx.strokeRect(W-25,H/2-90,25,180);

players.forEach(drawPlayer);

ctx.fillStyle="#fff";
ctx.beginPath();
ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
ctx.fill();

}

function drawPlayer(p){

/* gölge */
ctx.fillStyle="#0006";
ctx.beginPath();
ctx.ellipse(p.x,p.y+18,18,7,0,0,Math.PI*2);
ctx.fill();

/* bacak */
ctx.strokeStyle="#151515";
ctx.lineWidth=5;
ctx.beginPath();
ctx.moveTo(p.x-5,p.y+8);
ctx.lineTo(p.x-8,p.y+20);
ctx.moveTo(p.x+5,p.y+8);
ctx.lineTo(p.x+8,p.y+20);
ctx.stroke();

/* gövde */
ctx.fillStyle=p.color;
ctx.beginPath();
ctx.roundRect(p.x-12,p.y-5,24,25,6);
ctx.fill();

/* kafa */
ctx.fillStyle="#dba77b";
ctx.beginPath();
ctx.arc(p.x,p.y-15,10,0,Math.PI*2);
ctx.fill();

/* saç */
ctx.fillStyle="#24170f";
ctx.beginPath();
ctx.arc(p.x,p.y-18,10,Math.PI,Math.PI*2);
ctx.fill();

/* numara */
ctx.fillStyle="#fff";
ctx.font="bold 9px Arial";
ctx.textAlign="center";
ctx.fillText(p.number,p.x,p.y+8);

/* isim */
ctx.font="bold 10px Arial";
ctx.strokeStyle="#000";
ctx.lineWidth=3;
ctx.strokeText(p.name,p.x,p.y-30);
ctx.fillStyle="#fff";
ctx.fillText(p.name,p.x,p.y-30);

/* seçili */
if(players[selected]===p){

ctx.strokeStyle="#ffe600";
ctx.lineWidth=3;
ctx.beginPath();
ctx.arc(p.x,p.y-15,17,0,Math.PI*2);
ctx.stroke();

}

}


/* SON */

function endGame(){

running=false;
game.style.display="none";
finish.style.display="flex";

document.getElementById("finalScore").textContent=
score1+" - "+score2;

let text=
score1>score2?team1[0]+" KAZANDI! 🏆":
score2>score1?team2[0]+" KAZANDI! 🏆":
"BERABERE! 🤝";

document.getElementById("winner").textContent=text;

}


/* DÖNGÜ */

let last=performance.now();

function loop(now){

if(!running)return;

let dt=Math.min((now-last)/1000,.035);

last=now;

update(dt);
draw();

requestAnimationFrame(loop);

}

</script>
</body>
</html>
