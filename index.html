<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Müşteri Veresiye & Cari Defteri</title>
  <style>
    :root {
      --primary: #1565c0;
      --success: #2e7d32;
      --danger: #c62828;
      --bg: #f4f6f8;
      --card-bg: #ffffff;
      --text: #222;
    }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 12px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 550px;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      box-sizing: border-box;
    }
    h2 { text-align: center; color: var(--primary); margin-top: 0; }
    .form-group { margin-bottom: 10px; }
    label { font-size: 0.85rem; font-weight: 600; display: block; margin-bottom: 4px; }
    input, select {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 0.95rem;
    }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .full-width { grid-column: span 2; }
    button {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }
    .total-box {
      background: #e3f2fd;
      padding: 12px;
      border-radius: 8px;
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
      color: var(--primary);
    }
    .card {
      background: #fafafa;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 12px;
      margin-top: 10px;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .card-body { font-size: 0.85rem; color: #555; }
    .badge-borc { color: var(--danger); font-weight: bold; }
    .badge-odeme { color: var(--success); font-weight: bold; }
    .btn-del {
      background: var(--danger);
      padding: 4px 8px;
      font-size: 0.75rem;
      width: auto;
      margin-top: 8px;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>📖 Müşteri Cari & Veresiye Takibi</h2>

  <form id="cariForm" onsubmit="addTransaction(event)">
    <div class="grid">
      <div class="form-group full-width">
        <label>Müşteri Adı Soyadı:</label>
        <input type="text" id="customerName" placeholder="Örn: Mustafa Ağa" required>
      </div>

      <div class="form-group">
        <label>İşlem Türü:</label>
        <select id="type">
          <option value="borc">Borç Yaz (Satış Yapıldı)</option>
          <option value="odeme">Tahsilat (Ödeme Aldım)</option>
        </select>
      </div>

      <div class="form-group">
        <label>Tutar (TL):</label>
        <input type="number" id="amount" placeholder="5000" required>
      </div>

      <div class="form-group full-width">
        <label>Açıklama (Ürün / Detay):</label>
        <input type="text" id="note" placeholder="Örn: 10 ton mısır silajı teslim edildi">
      </div>
    </div>
    <button type="submit">Cari Kaydı Ekle</button>
  </form>

  <div class="total-box">
    Piyasadan Toplam Alacak: <span id="totalDebt">0</span> TL
  </div>

  <h3 style="margin-top:20px;">Müşteri Hareketleri</h3>
  <div id="recordList"></div>
</div>

<script>
  let records = JSON.parse(localStorage.getItem('cariDefter')) || [];

  function addTransaction(e) {
    e.preventDefault();
    const item = {
      id: Date.now(),
      name: document.getElementById('customerName').value,
      type: document.getElementById('type').value,
      amount: parseFloat(document.getElementById('amount').value),
      note: document.getElementById('note').value,
      date: new Date().toLocaleDateString('tr-TR')
    };

    records.push(item);
    saveAndRender();
    document.getElementById('cariForm').reset();
  }

  function deleteRecord(id) {
    records = records.filter(r => r.id !== id);
    saveAndRender();
  }

  function saveAndRender() {
    localStorage.setItem('cariDefter', JSON.stringify(records));
    const list = document.getElementById('recordList');
    list.innerHTML = '';

    let totalAlacak = 0;

    records.forEach(r => {
      if (r.type === 'borc') totalAlacak += r.amount;
      if (r.type === 'odeme') totalAlacak -= r.amount;

      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-header">
          <span>${r.name}</span>
          <span class="${r.type === 'borc' ? 'badge-borc' : 'badge-odeme'}">
            ${r.type === 'borc' ? '+' : '-'}${r.amount.toLocaleString('tr-TR')} TL
          </span>
        </div>
        <div class="card-body">
          <p style="margin:2px 0;"><strong>Tür:</strong> ${r.type === 'borc' ? 'Veresiye Satış' : 'Tahsilat'}</p>
          <p style="margin:2px 0;"><strong>Açıklama:</strong> ${r.note || 'Yok'}</p>
          <p style="margin:2px 0;"><strong>Tarih:</strong> ${r.date}</p>
          <button class="btn-del" onclick="deleteRecord(${r.id})">Sil</button>
        </div>
      `;
      list.appendChild(card);
    });

    document.getElementById('totalDebt').innerText = totalAlacak.toLocaleString('tr-TR');
  }

  saveAndRender();
</script>

</body>
</html>
