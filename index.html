<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#111827">
<title>Demirkapı Çiftliği</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f4f6;
    color:#111827;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}
.app{
    min-height:100vh;
    display:flex;
}
.sidebar{
    width:250px;
    background:#111827;
    color:white;
    padding:20px 14px;
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    overflow-y:auto;
    z-index:20;
}
.logo{
    text-align:center;
    padding:15px 5px 25px;
}
.logo-icon{
    width:58px;
    height:58px;
    background:#16a34a;
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:auto;
    font-size:30px;
}
.logo h2{margin-top:10px;font-size:18px}
.logo p{font-size:11px;color:#9ca3af;margin-top:4px}
.menu-title{
    font-size:10px;
    color:#6b7280;
    margin:18px 10px 8px;
    font-weight:bold;
}
.nav-btn{
    width:100%;
    background:transparent;
    color:#d1d5db;
    padding:12px 13px;
    margin:3px 0;
    border-radius:10px;
    text-align:left;
    display:flex;
    gap:11px;
    align-items:center;
}
.nav-btn:hover,.nav-btn.active{
    background:#1f2937;
    color:white;
}
.nav-btn.active{border-left:3px solid #22c55e}
.main{
    margin-left:250px;
    width:calc(100% - 250px);
    min-height:100vh;
}
.topbar{
    height:70px;
    background:white;
    border-bottom:1px solid #e5e7eb;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
    position:sticky;
    top:0;
    z-index:10;
}
.topbar h1{font-size:20px}
.date{font-size:13px;color:#6b7280}
.content{padding:25px}
.page{display:none}
.page.active{display:block}
.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:20px;
}
.card{
    background:white;
    border-radius:15px;
    padding:19px;
    box-shadow:0 2px 10px rgba(0,0,0,.04);
}
.card-top{
    display:flex;
    justify-content:space-between;
    color:#6b7280;
    font-size:13px;
}
.card-value{
    font-size:25px;
    font-weight:bold;
    margin-top:10px;
}
.card-icon{
    width:38px;
    height:38px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#ecfdf5;
    font-size:19px;
}
.grid2{
    display:grid;
    grid-template-columns:1.3fr .7fr;
    gap:20px;
}
.panel{
    background:white;
    border-radius:15px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 2px 10px rgba(0,0,0,.04);
}
.panel-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
}
.panel h3{font-size:16px}
.btn{
    padding:10px 14px;
    border-radius:9px;
    font-weight:bold;
}
.btn-green{background:#16a34a;color:white}
.btn-green:hover{background:#15803d}
.btn-dark{background:#111827;color:white}
.btn-red{background:#dc2626;color:white}
.btn-gray{background:#e5e7eb;color:#111827}
.btn-blue{background:#2563eb;color:white}
.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-group.full{grid-column:1/-1}
.form-group label{
    font-size:12px;
    color:#4b5563;
    font-weight:bold;
}
.form-group input,
.form-group select,
.form-group textarea,
.search{
    border:1px solid #d1d5db;
    border-radius:9px;
    padding:11px;
    outline:none;
    background:white;
}
.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus,
.search:focus{
    border-color:#16a34a;
}
.actions{
    display:flex;
    gap:8px;
    margin-top:16px;
    flex-wrap:wrap;
}
.table-wrap{overflow-x:auto}
table{
    width:100%;
    border-collapse:collapse;
    min-width:650px;
}
th{
    background:#f9fafb;
    text-align:left;
    font-size:11px;
    color:#6b7280;
    padding:12px;
}

    border-top
